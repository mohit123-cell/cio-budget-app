{% extends 'base.html' %}

{% block title %}{{ mode }} Announcement | CIO Budget App{% endblock %}

{% block content %}
  <div class="card center-card">
    <h1>{{ mode }} announcement</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save announcement</button>
    </form>
  </div>
{% endblock %}
