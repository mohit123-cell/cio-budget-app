{% extends 'base.html' %}

{% block title %}Delete Document | CIO Budget App{% endblock %}

{% block content %}
  <div class="card center-card danger-zone">
    <h1>Delete document</h1>
    <p>Are you sure you want to delete <strong>{{ document.title }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button class="danger" type="submit">Delete document</button>
    </form>
  </div>
{% endblock %}
